<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バイオガス定例会ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: header summary strip → weekly timetable (Mon–Fri, like a plant shift board) → filterable meeting sheets */
:root {
  --bg: #eef3f0;
  --surface: #ffffff;
  --ink: #15231d;
  --muted: #59695f;
  --line: #d4ded8;
  --accent: #0e6a54;
  --accent-ink: #ffffff;
  --flame: #c97a0c;
  --c-steer: #3a4f8f; --c-eng: #1f7a8c; --c-constr: #9a5b12; --c-feed: #5c7a1f;
  --c-om: #0e6a54; --c-permit: #7a4b8f; --c-grid: #b0452f; --c-hse: #a3861a;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1613; --surface: #15201b; --ink: #e2ebe6; --muted: #93a49a; --line: #26352e;
    --accent: #4cc39f; --accent-ink: #0b1511; --flame: #f0ad48;
    --c-steer: #8ea2e6; --c-eng: #62c3d4; --c-constr: #e0a55c; --c-feed: #a8c962;
    --c-om: #4cc39f; --c-permit: #c49ad8; --c-grid: #ee8a73; --c-hse: #e0c65a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1613; --surface: #15201b; --ink: #e2ebe6; --muted: #93a49a; --line: #26352e;
  --accent: #4cc39f; --accent-ink: #0b1511; --flame: #f0ad48;
  --c-steer: #8ea2e6; --c-eng: #62c3d4; --c-constr: #e0a55c; --c-feed: #a8c962;
  --c-om: #4cc39f; --c-permit: #c49ad8; --c-grid: #ee8a73; --c-hse: #e0c65a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.6;
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 28px; min-width: 0; }
.wrap > * { min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* Header */
header.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding-block: 28px 20px; border-bottom: 1px solid var(--line);
}
.brand { display: grid; gap: 4px; min-width: 0; }
.brand h1 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 900; letter-spacing: .01em; line-height: 1.2; }
.brand h1 .gas { font-family: var(--f-mono); font-weight: 600; font-size: .5em; vertical-align: .35em; color: var(--accent);
  border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 6px; margin-right: 10px; letter-spacing: 0; }
.brand p { margin: 0; color: var(--muted); }
.sample-note { font-size: 12px; color: var(--flame); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Summary */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.stat.next { border-color: color-mix(in srgb, var(--flame) 55%, var(--line)); }
.stat.next .v { font-size: 17px; }
.stat.next .when { color: var(--flame); font-weight: 600; }

/* Section heads */
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.sec-head h2 { font-size: 20px; font-weight: 700; }
.sec-head .hint { color: var(--muted); font-size: 12px; }

/* Timetable */
.tt-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.tt { display: grid; grid-template-columns: 52px repeat(5, minmax(128px, 1fr)); min-width: 720px; position: relative; }
.tt .dh { padding: 10px 8px; font-weight: 700; font-family: var(--f-display); border-bottom: 1px solid var(--line); text-align: center; }
.tt .dh.today { color: var(--flame); }
.tt .dh.today::after { content: "●"; font-size: 8px; vertical-align: 3px; margin-left: 4px; }
.tt .hours { position: relative; border-right: 1px solid var(--line); }
.tt .hours span { position: absolute; right: 6px; transform: translateY(-50%); font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.tt .col { position: relative; border-left: 1px solid var(--line); }
.tt .col:nth-child(2) { border-left: 0; }
.tt .gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed color-mix(in srgb, var(--line) 80%, transparent); }
.blk {
  position: absolute; border-radius: 6px; padding: 4px 7px; overflow: hidden; cursor: pointer; text-align: left;
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 16%, var(--surface));
  border-left: 3px solid var(--c); color: var(--ink); font-size: 12px; line-height: 1.35;
  display: flex; flex-direction: column; gap: 1px;
}
.blk:hover { background: color-mix(in srgb, var(--c) 26%, var(--surface)); }
.blk .t { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.blk .n { font-weight: 700; }
.blk .f { font-size: 10.5px; color: var(--c); font-weight: 700; }
.blk.dim { opacity: .28; }
.blk.short { flex-direction: row; align-items: center; gap: 6px; padding-block: 2px; white-space: nowrap; }
.blk.short .n { overflow: hidden; text-overflow: ellipsis; }
.tt .hours span:first-child { transform: none; }
.tt .hours span:last-child { transform: translateY(-100%); }
.nowline { position: absolute; left: 0; right: 0; border-top: 2px solid var(--flame); z-index: 2; pointer-events: none; }

/* Upcoming */
.up-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.up-list li { display: grid; grid-template-columns: 110px 64px 1fr; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.up-list li:first-child { border-top: 0; }
.up-list .d { font-weight: 600; font-variant-numeric: tabular-nums; }
.up-list .d.today { color: var(--flame); }
.up-list .nm { min-width: 0; }
.up-list .nm button { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 500; text-align: left; }
.up-list .nm button:hover { color: var(--accent); text-decoration: underline; }
.up-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px;
}
.chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--surface)); font-weight: 700; }
.search { flex: 1 1 220px; min-width: 0; max-width: 340px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; }

/* Meeting sheets */
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.sheet {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  display: grid; grid-template-rows: auto 1fr; overflow: hidden; min-width: 0; scroll-margin-top: 16px;
}
.sheet.flash { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 55%, transparent); }
.sheet-hd { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line);
  background: linear-gradient(to right, color-mix(in srgb, var(--c) 10%, var(--surface)), var(--surface) 70%); }
.code { grid-row: span 2; align-self: start; font-family: var(--f-mono); font-weight: 600; font-size: 12px; color: var(--c);
  border: 1.5px solid var(--c); border-radius: 5px; padding: 2px 6px; margin-top: 3px; }
.sheet-hd h3 { font-size: 18px; font-weight: 700; line-height: 1.35; }
.sheet-hd .type { font-size: 12px; color: var(--muted); }
.sheet-bd { display: grid; grid-template-columns: 96px 1fr; gap: 10px 14px; padding: 14px 16px 16px; align-content: start; }
.sheet-bd dt { font-size: 12px; color: var(--muted); font-weight: 500; padding-top: 1px; }
.sheet-bd dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.when-line { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.when-line .freq { font-weight: 700; }
.when-line .nx { font-size: 12px; color: var(--flame); }
.owner { font-weight: 700; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.people span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; background: var(--bg); }
.docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.docs li { display: flex; gap: 8px; align-items: baseline; }
.docs li::before { content: ""; flex: none; width: 9px; height: 11px; border: 1.5px solid var(--muted); border-radius: 1px; transform: translateY(1px); }
.docs .nolink { color: var(--ink); }
.docs .nolink em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 6px; }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }

footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
footer code { font-family: var(--f-mono); }

@media (max-width: 560px) {
  .sheet-bd { grid-template-columns: 1fr; gap: 2px; }
  .sheet-bd dd { margin-bottom: 10px; }
  .up-list li { grid-template-columns: 88px 1fr; }
  .up-list li .tm { grid-column: 2; grid-row: 1; }
  .up-list li .nm { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { transition: box-shadow .3s; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="label" id="eyebrow"></span>
      <h1><span class="gas">CH₄</span><span id="title"></span></h1>
      <p id="subtitle"></p>
      <span class="sample-note" id="sampleNote" hidden></span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="btn-ja" data-lang="ja">日本語</button>
      <button type="button" id="btn-en" data-lang="en">English</button>
    </div>
  </header>

  <section class="summary" id="summary" aria-live="polite"></section>

  <section>
    <div class="sec-head">
      <h2 id="h-week"></h2>
      <span class="hint" id="hint-week"></span>
    </div>
    <div class="tt-scroll"><div class="tt" id="tt"></div></div>
  </section>

  <section>
    <div class="sec-head">
      <h2 id="h-up"></h2>
      <span class="hint" id="hint-up"></span>
    </div>
    <ul class="up-list" id="upcoming"></ul>
  </section>

  <section>
    <div class="sec-head">
      <h2 id="h-list"></h2>
      <span class="hint" id="count"></span>
    </div>
    <div class="filters" id="filters"></div>
    <div class="sheets" id="sheets"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script src="meetings.js"></script>
<script>
(function () {
  const DATA = window.MEETINGS_DATA;
  const TYPES = Object.fromEntries(DATA.types.map(t => [t.id, t]));

  const I18N = {
    ja: {
      eyebrow: "定例会管理ダッシュボード",
      subtitle: "定例会の種類・開催日時・参加者・主担当・目的・関連資料をまとめて確認できます。",
      sample: "※ 表示中の定例会はサンプルです。meetings.js を編集して実際の内容に置き換えてください。",
      statCount: "定例会", statCountU: "件",
      statHours: "週あたり会議時間（平均）", statHoursU: "時間",
      statTypes: "分科会・種類", statTypesU: "種類",
      statNext: "次回の定例会",
      hWeek: "週間スケジュール", hintWeek: "枠をクリックすると詳細へ移動します。隔週・月次は該当週のみ開催。",
      hUp: "今後2週間の開催予定", hintUp: "隔週・月次のルールから自動計算",
      hList: "定例会一覧", all: "すべて", search: "名前・参加者・目的で検索",
      count: n => `${n} 件表示`,
      none: "条件に合う定例会はありません。",
      noneUp: "今後2週間の開催予定はありません。",
      when: "開催", where: "場所", owner: "主担当", people: "参加者", purpose: "目的", docs: "関連資料",
      nolink: "リンク未設定",
      weekly: "毎週", biweekly: "隔週",
      monthly: n => n === -1 ? "毎月最終" : `毎月第${n}`,
      nextOn: d => `次回 ${d}`,
      min: m => `${m}分`,
      today: "今日", tomorrow: "明日",
      days: ["日", "月", "火", "水", "木", "金", "土"],
      dayFull: d => ["日曜", "月曜", "火曜", "水曜", "木曜", "金曜", "土曜"][d],
      date: dt => `${dt.getMonth() + 1}/${dt.getDate()}（${"日月火水木金土"[dt.getDay()]}）`,
      footer: "データは <code>meetings.js</code> で管理しています。時刻は日本時間（JST）。",
      title: document.title
    },
    en: {
      eyebrow: "Recurring meeting dashboard",
      subtitle: "Meeting type, schedule, attendees, owner, purpose and related documents in one place.",
      sample: "The meetings shown are sample data. Edit meetings.js to replace them with your own.",
      statCount: "Recurring meetings", statCountU: "",
      statHours: "Meeting hours per week (avg.)", statHoursU: "h",
      statTypes: "Workstreams", statTypesU: "",
      statNext: "Next meeting",
      hWeek: "Weekly schedule", hintWeek: "Click a block to jump to its details. Biweekly and monthly meetings run only in their weeks.",
      hUp: "Next 2 weeks", hintUp: "Calculated from biweekly and monthly rules",
      hList: "All meetings", all: "All", search: "Search name, attendees, purpose",
      count: n => `${n} shown`,
      none: "No meetings match these filters.",
      noneUp: "No meetings in the next 2 weeks.",
      when: "Schedule", where: "Location", owner: "Owner", people: "Attendees", purpose: "Purpose", docs: "Documents",
      nolink: "not linked",
      weekly: "Weekly", biweekly: "Biweekly",
      monthly: n => n === -1 ? "Monthly, last" : `Monthly, ${n}${["st", "nd", "rd"][n - 1] || "th"}`,
      nextOn: d => `Next: ${d}`,
      min: m => `${m} min`,
      today: "Today", tomorrow: "Tomorrow",
      days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      dayFull: d => ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][d],
      date: dt => `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][dt.getDay()]} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getMonth()]} ${dt.getDate()}`,
      footer: "Data lives in <code>meetings.js</code>. Times are Japan Standard Time (JST).",
      title: "Biogas Meeting Board"
    }
  };

  const state = { lang: "ja", type: "all", q: "" };
  try {
    const saved = localStorage.getItem("biogas-meeting-lang");
    if (saved === "ja" || saved === "en") state.lang = saved;
  } catch (e) {}
  if (location.hash === "#en") state.lang = "en";
  if (location.hash === "#ja") state.lang = "ja";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const L = obj => (obj && (obj[state.lang] || obj.ja || obj.en)) || "";
  const T = () => I18N[state.lang];

  // ---- schedule logic ----
  const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
  const fmtTime = min => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
  const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const mondayOf = d => addDays(dayStart(d), -((d.getDay() + 6) % 7));

  function occursOn(m, date) {
    if (date.getDay() !== m.weekday) return false;
    const f = m.frequency || { kind: "weekly" };
    if (f.kind === "weekly") return true;
    if (f.kind === "biweekly") {
      const weeks = Math.round((mondayOf(date) - mondayOf(parseDate(f.anchor))) / (7 * 864e5));
      return weeks % 2 === 0;
    }
    if (f.kind === "monthly") {
      if (f.nth === -1) return addDays(date, 7).getMonth() !== date.getMonth();
      return Math.floor((date.getDate() - 1) / 7) + 1 === f.nth;
    }
    return false;
  }

  function occurrences(fromDate, days) {
    const out = [];
    for (let i = 0; i < days; i++) {
      const d = addDays(fromDate, i);
      DATA.meetings.forEach(m => { if (occursOn(m, d)) out.push({ m, date: d, start: toMin(m.time) }); });
    }
    return out.sort((a, b) => a.date - b.date || a.start - b.start);
  }

  function nextOccurrence(m, now) {
    const today = dayStart(now), nowMin = now.getHours() * 60 + now.getMinutes();
    for (let i = 0; i < 70; i++) {
      const d = addDays(today, i);
      if (occursOn(m, d) && (i > 0 || toMin(m.time) + m.duration > nowMin)) return d;
    }
    return null;
  }

  function freqLabel(m) {
    const f = m.frequency || { kind: "weekly" }, t = T();
    const base = f.kind === "monthly" ? t.monthly(f.nth) : t[f.kind];
    return state.lang === "ja" ? `${base}${t.dayFull(m.weekday)}` : `${base} ${t.dayFull(m.weekday)}`;
  }
  const freqShort = m => {
    const f = m.frequency || { kind: "weekly" }, t = T();
    return f.kind === "monthly" ? t.monthly(f.nth) : t[f.kind];
  };

  function relDate(d, now) {
    const diff = Math.round((d - dayStart(now)) / 864e5), t = T();
    if (diff === 0) return t.today;
    if (diff === 1) return t.tomorrow;
    return t.date(d);
  }

  // average weekly minutes: weekly=1, biweekly=0.5, monthly≈12/52
  const perWeek = m => ({ weekly: 1, biweekly: 0.5, monthly: 12 / 52 }[(m.frequency || {}).kind] || 1);

  // ---- rendering ----
  function matches(m) {
    if (state.type !== "all" && m.type !== state.type) return false;
    if (!state.q) return true;
    const hay = [m.name, m.owner, m.purpose, m.location, ...m.participants, ...m.materials, TYPES[m.type]]
      .flatMap(o => [o && o.ja, o && o.en]).join(" ").toLowerCase();
    return hay.includes(state.q.toLowerCase());
  }

  function renderStatic() {
    const t = T();
    document.documentElement.lang = state.lang;
    document.title = t.title;
    $("eyebrow").textContent = t.eyebrow;
    $("title").textContent = L(DATA.project);
    $("subtitle").textContent = t.subtitle;
    $("sampleNote").hidden = !DATA.sample;
    $("sampleNote").textContent = t.sample;
    $("h-week").textContent = t.hWeek; $("hint-week").textContent = t.hintWeek;
    $("h-up").textContent = t.hUp; $("hint-up").textContent = t.hintUp;
    $("h-list").textContent = t.hList;
    $("footer").innerHTML = t.footer;
    ["ja", "en"].forEach(l => $("btn-" + l).setAttribute("aria-pressed", String(state.lang === l)));
  }

  function renderSummary(now) {
    const t = T();
    const hours = DATA.meetings.reduce((s, m) => s + m.duration * perWeek(m), 0) / 60;
    const upcoming = DATA.meetings
      .map(m => ({ m, d: nextOccurrence(m, now) }))
      .filter(x => x.d)
      .sort((a, b) => a.d - b.d || toMin(a.m.time) - toMin(b.m.time))[0];
    const usedTypes = new Set(DATA.meetings.map(m => m.type)).size;
    $("summary").innerHTML = `
      <div class="stat"><span class="label">${t.statCount}</span><span class="v">${DATA.meetings.length}<small>${t.statCountU}</small></span></div>
      <div class="stat"><span class="label">${t.statHours}</span><span class="v">${hours.toFixed(1)}<small>${t.statHoursU}</small></span></div>
      <div class="stat"><span class="label">${t.statTypes}</span><span class="v">${usedTypes}<small>${t.statTypesU}</small></span></div>
      <div class="stat next"><span class="label">${t.statNext}</span>${upcoming ? `
        <span class="v">${esc(L(upcoming.m.name))}</span>
        <span><span class="when">${relDate(upcoming.d, now)}</span> <span class="mono">${upcoming.m.time}</span></span>` : "—"}
      </div>`;
  }

  const START = 8 * 60, END = 19 * 60, PX = 1.1; // px per minute
  function renderTimetable(now) {
    const t = T(), tt = $("tt");
    const height = (END - START) * PX;
    const days = [1, 2, 3, 4, 5];
    let html = `<div class="dh"></div>` + days.map(d =>
      `<div class="dh${now.getDay() === d ? " today" : ""}">${t.days[d]}</div>`).join("");
    let hours = "";
    for (let h = START; h <= END; h += 60) hours += `<span class="mono" style="top:${(h - START) * PX}px">${fmtTime(h)}</span>`;
    html += `<div class="hours" style="height:${height}px">${hours}</div>`;
    days.forEach(d => {
      let lines = "";
      for (let h = START + 60; h < END; h += 60) lines += `<div class="gridline" style="top:${(h - START) * PX}px"></div>`;
      // lane assignment for overlaps
      const list = DATA.meetings.filter(m => m.weekday === d).map(m => ({ m, s: toMin(m.time), e: toMin(m.time) + m.duration }))
        .sort((a, b) => a.s - b.s);
      const laneEnds = [];
      list.forEach(x => {
        let lane = laneEnds.findIndex(e => e <= x.s);
        if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
        laneEnds[lane] = x.e; x.lane = lane;
      });
      const lanes = Math.max(1, laneEnds.length);
      const blocks = list.map(x => {
        const top = (Math.max(x.s, START) - START) * PX, h = Math.max(22, (Math.min(x.e, END) - Math.max(x.s, START)) * PX - 2);
        const w = 100 / lanes;
        return `<button type="button" class="blk${matches(x.m) ? "" : " dim"}${h < 40 ? " short" : ""}" data-goto="${esc(x.m.id)}"
          style="--c:var(--c-${esc(x.m.type)});top:${top}px;height:${h}px;left:calc(${x.lane * w}% + 3px);width:calc(${w}% - 6px)"
          title="${esc(L(x.m.name))} ${x.m.time}">
          <span class="t">${h < 40 ? x.m.time : `${x.m.time}–${fmtTime(x.e)}`}</span>
          <span class="n">${esc(L(x.m.name))}</span>
          ${h > 48 ? `<span class="f">${esc(freqShort(x.m))}</span>` : ""}
        </button>`;
      }).join("");
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const nowLine = now.getDay() === d && nowMin >= START && nowMin <= END ? `<div class="nowline" style="top:${(nowMin - START) * PX}px"></div>` : "";
      html += `<div class="col" style="height:${height}px">${lines}${blocks}${nowLine}</div>`;
    });
    tt.innerHTML = html;
  }

  function renderUpcoming(now) {
    const t = T();
    const items = occurrences(dayStart(now), 14).filter(o => matches(o.m));
    $("upcoming").innerHTML = items.length ? items.map(o => `
      <li style="--c:var(--c-${esc(o.m.type)})">
        <span class="d${o.date.getTime() === dayStart(now).getTime() ? " today" : ""}">${relDate(o.date, now)}</span>
        <span class="tm mono">${o.m.time}</span>
        <span class="nm"><span class="code" style="margin-right:8px;padding:0 5px;font-size:11px">${esc(TYPES[o.m.type].code)}</span><button type="button" data-goto="${esc(o.m.id)}">${esc(L(o.m.name))}</button>
          <span class="label" style="text-transform:none;letter-spacing:0">· ${esc(L(o.m.owner))}</span></span>
      </li>`).join("") : `<li><span></span><span></span><span class="nm" style="color:var(--muted)">${t.noneUp}</span></li>`;
  }

  function renderFilters() {
    const t = T();
    const used = DATA.types.filter(ty => DATA.meetings.some(m => m.type === ty.id));
    $("filters").innerHTML =
      `<button type="button" class="chip" data-type="all" aria-pressed="${state.type === "all"}">${t.all}</button>` +
      used.map(ty => `<button type="button" class="chip" data-type="${esc(ty.id)}" style="--c:var(--c-${esc(ty.id)})" aria-pressed="${state.type === ty.id}">
        <span class="sw"></span>${esc(L(ty))}</button>`).join("") +
      `<input type="search" class="search" id="q" placeholder="${esc(t.search)}" value="${esc(state.q)}" aria-label="${esc(t.search)}">`;
  }

  function renderSheets(now) {
    const t = T();
    const list = DATA.meetings.filter(matches)
      .sort((a, b) => a.weekday - b.weekday || toMin(a.time) - toMin(b.time));
    $("count").textContent = t.count(list.length);
    $("sheets").innerHTML = list.length ? list.map(m => {
      const ty = TYPES[m.type] || { code: "—" }, end = toMin(m.time) + m.duration, nx = nextOccurrence(m, now);
      return `<article class="sheet" id="m-${esc(m.id)}" style="--c:var(--c-${esc(m.type)})">
        <div class="sheet-hd">
          <span class="code">${esc(ty.code)}</span>
          <h3>${esc(L(m.name))}</h3>
          <span class="type">${esc(L(ty))}</span>
        </div>
        <dl class="sheet-bd">
          <dt>${t.when}</dt>
          <dd class="when-line"><span class="freq">${esc(freqLabel(m))}</span>
            <span class="mono">${m.time}–${fmtTime(end)}</span>
            <span style="color:var(--muted);font-size:12px">${t.min(m.duration)}</span>
            ${nx ? `<span class="nx">${t.nextOn(relDate(nx, now))}</span>` : ""}</dd>
          <dt>${t.where}</dt><dd>${esc(L(m.location))}</dd>
          <dt>${t.owner}</dt><dd class="owner">${esc(L(m.owner))}</dd>
          <dt>${t.people}</dt><dd class="people">${m.participants.map(p => `<span>${esc(L(p))}</span>`).join("")}</dd>
          <dt>${t.purpose}</dt><dd>${esc(L(m.purpose))}</dd>
          <dt>${t.docs}</dt><dd><ul class="docs">${m.materials.map(d => d.url
            ? `<li><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(L(d))}</a></li>`
            : `<li><span class="nolink">${esc(L(d))}<em>${t.nolink}</em></span></li>`).join("")}</ul></dd>
        </dl>
      </article>`;
    }).join("") : `<div class="empty">${t.none}</div>`;
  }

  function renderDynamic() {
    const now = new Date();
    renderSummary(now); renderTimetable(now); renderUpcoming(now); renderSheets(now);
  }
  function renderAll() { renderStatic(); renderFilters(); renderDynamic(); }

  // ---- events ----
  document.addEventListener("click", e => {
    const lang = e.target.closest("[data-lang]");
    if (lang) {
      state.lang = lang.dataset.lang;
      try { localStorage.setItem("biogas-meeting-lang", state.lang); } catch (err) {}
      renderAll(); return;
    }
    const chip = e.target.closest("[data-type]");
    if (chip) {
      state.type = chip.dataset.type;
      document.querySelectorAll("[data-type]").forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
      renderDynamic(); return;
    }
    const go = e.target.closest("[data-goto]");
    if (go) {
      let el = $("m-" + go.dataset.goto);
      if (!el) { state.type = "all"; state.q = ""; renderFilters(); renderDynamic(); el = $("m-" + go.dataset.goto); }
      if (!el) return;
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600);
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "q") { state.q = e.target.value.trim(); renderDynamic(); }
  });

  renderAll();
  setInterval(renderDynamic, 60 * 1000);
})();
</script>
</body>
</html>
